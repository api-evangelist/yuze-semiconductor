aid: yuze-semiconductor
name: Yuze Semiconductor
description: 'Yuze Semiconductor — legally Yunnan Yuze New Energy Co., Ltd. (云南宇泽新能源股份有限公司),
  trading internationally as Unigrace New Energy — is a Chinese photovoltaic materials manufacturer
  founded in May 2019 and headquartered in Kunming, Yunnan. It produces N-type solar monocrystalline
  silicon rods and wafers covering the three mainstream N-type cell routes (HJT, TOPCon and IBC),
  operating manufacturing bases in Chuxiong, Wenshan and Kunming in Yunnan and Yichun in Jiangxi,
  with a sales centre in Suzhou. The company was named a 2022 Chinese Unicorn Enterprise and its
  shares trade on secondary private markets. It is a physical-goods manufacturer: its public web
  presence carries company, product, news and recruitment pages only, with no developer program,
  no API, and no machine-readable specification of any kind.'
